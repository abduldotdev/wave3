# Elgato Wave:3 (USB 0fd9:0070): keep it the preferred, always-awake input.
# Matched by name pattern, never by a device identity string or numeric id.

monitor.alsa.rules = [
  # Pin the analog profile. find-best-profile honours device.profile when no
  # profile is stored in ~/.local/state/wireplumber/default-profile.
  {
    matches = [
      { device.name = "~alsa_card.usb-Elgato_Systems_Elgato_Wave_3.*" }
    ]
    actions = {
      update-props = {
        device.profile       = "output:analog-stereo+input:mono-fallback"
        api.acp.auto-profile = false
      }
    }
  },
  # Rank the mic above every other source, including another mic or webcam mic,
  # and never suspend it: the idle-suspended node sometimes fails to wake.
  {
    matches = [
      { node.name = "~alsa_input.usb-Elgato_Systems_Elgato_Wave_3.*" }
    ]
    actions = {
      update-props = {
        priority.session                = 3000
        priority.driver                 = 3000
        session.suspend-timeout-seconds = 0
      }
    }
  },
  {
    matches = [
      { node.name = "~alsa_output.usb-Elgato_Systems_Elgato_Wave_3.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
